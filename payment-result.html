<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kết quả thanh toán — Thiên Cơ AI</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="logo.png">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .result-card {
    position: relative; z-index: 1;
    background: var(--bg2); border: 1px solid var(--card-border);
    border-radius: 24px; padding: 48px 40px; text-align: center;
    max-width: 440px; width: 100%;
    box-shadow: var(--shadow), var(--glow);
  }
  .result-card.fail { border-color: rgba(255,100,100,0.3); }
  .result-icon { font-size: 3.5rem; margin-bottom: 16px; }
  .result-title { font-size: 1.5rem; font-weight: 800; color: var(--text); margin: 0 0 10px; }
  .result-sub { color: var(--text-dim); font-size: 0.95rem; margin: 0 0 8px; line-height: 1.6; }
  .order-code {
    display: inline-block; background: rgba(232,184,75,0.1);
    border: 1px solid rgba(232,184,75,0.3); color: var(--gold);
    border-radius: 10px; padding: 8px 20px; font-weight: 800;
    font-size: 1rem; margin: 16px 0 24px; letter-spacing: 1px;
  }
  .mock-note {
    display: none; margin-bottom: 20px; padding: 10px 14px;
    background: rgba(255,180,23,0.1); border: 1px solid rgba(255,180,23,0.3);
    color: #f0b429; border-radius: 10px; font-size: 0.78rem; line-height: 1.5;
  }
</style>
</head>
<body>
<div class="stars-bg"></div>

<div class="result-card" id="card">
  <p class="mock-note" id="mockNote">🧪 Chế độ demo cục bộ — chưa kết nối cổng thanh toán MoMo/VNPay thật. Xem <code>HUONG_DAN_DEPLOY.md</code> để kích hoạt cổng thật.</p>
  <div class="result-icon" id="icon">⏳</div>
  <h2 class="result-title" id="title">Đang xác nhận…</h2>
  <p class="result-sub" id="sub"></p>
  <div class="order-code" id="orderCode"></div>
  <a href="index.html#pricing" class="btn btn-primary">Về trang chủ 🏠</a>
</div>

<script>
  const params  = new URLSearchParams(location.search);
  const method  = params.get('method');   // momo | vnpay
  const order   = params.get('order');
  const icon    = document.getElementById('icon');
  const title   = document.getElementById('title');
  const sub     = document.getElementById('sub');
  const codeEl  = document.getElementById('orderCode');

  codeEl.textContent = order || '';
  if (params.get('mock') === '1') document.getElementById('mockNote').style.display = 'block';

  // MoMo trả về resultCode=0 nếu thành công
  // VNPay trả về vnp_ResponseCode=00 nếu thành công
  let success = false;
  if (method === 'momo') {
    success = params.get('resultCode') === '0';
  } else if (method === 'vnpay') {
    success = params.get('vnp_ResponseCode') === '00';
  }

  if (success) {
    icon.textContent  = '🎉';
    title.textContent = 'Thanh toán thành công!';
    sub.textContent   = 'Cảm ơn bạn đã đăng ký. Đội ngũ Thiên Cơ AI sẽ liên hệ kích hoạt gói của bạn trong 15 phút.';
  } else {
    icon.textContent  = '❌';
    title.textContent = 'Thanh toán thất bại';
    sub.textContent   = 'Đăng ký chưa được thanh toán. Bạn có thể quay lại và thử lại hoặc chọn phương thức khác.';
    document.getElementById('card').classList.add('fail');
  }
</script>
</body>
</html>
